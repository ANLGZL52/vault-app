workflows:
  ios-release:
    name: iOS App Store Release
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: 3.44.2
      xcode: latest
      cocoapods: default
      groups:
        - appstore_credentials
      vars:
        BUNDLE_ID: com.anilguzel.vault
        XCODE_WORKSPACE: ios/Runner.xcworkspace
        XCODE_SCHEME: Runner
        APP_STORE_ID: "6782353694"
        APPLE_TEAM_ID: 25YU5R23MS

    scripts:
      - name: Set up keychain
        script: keychain initialize

      - name: Delete existing Distribution certificates
        script: |
          # List ALL certs (no --type, IOS_DISTRIBUTION flag returns empty for these certs)
          app-store-connect certificates list \
            --json > /tmp/certs.json 2>/dev/null \
            || echo "[]" > /tmp/certs.json
          echo "Raw JSON (first 500 chars): $(head -c 500 /tmp/certs.json)"
          # Delete certs whose JSON representation contains "DISTRIBUTION"
          python3 -c "import json;d=json.load(open('/tmp/certs.json'));items=d if isinstance(d,list) else d.get('data',[]);[open('/tmp/cert_ids.txt','a').write(i.get('id','')+'\n') for i in items if i.get('id','') and 'DISTRIBUTION' in str(i).upper()]" 2>/dev/null \
            || touch /tmp/cert_ids.txt
          echo "Distribution cert IDs to delete: $(cat /tmp/cert_ids.txt 2>/dev/null)"
          while IFS= read -r cert_id; do
            [ -z "$cert_id" ] && continue
            echo "Deleting: $cert_id"
            app-store-connect certificates delete "$cert_id" 2>&1 \
              && echo "Deleted OK" || echo "Delete failed (continuing)"
          done < /tmp/cert_ids.txt 2>/dev/null || true
          echo "Certificate cleanup done."

      - name: Fetch signing files
        script: |
          openssl genrsa -out /tmp/dist_key.pem 2048
          app-store-connect fetch-signing-files \
            "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key @file:/tmp/dist_key.pem \
            --create

      - name: Add certificates to keychain
        script: keychain add-certificates

      - name: Flutter version
        script: flutter --version

      - name: Install dependencies
        script: flutter pub get

      - name: Flutter analyze
        script: flutter analyze

      - name: Build iOS (no codesign)
        script: |
          flutter build ios \
            --release \
            --no-codesign

      - name: Set up code signing
        script: xcode-project use-profiles

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false
      email:
        recipients:
          - anlgzl52@gmail.com
        notify:
          success: true
          failure: true
