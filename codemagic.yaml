workflows:
  ios-release:
    name: iOS App Store Release
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: 3.44.2
      xcode: latest
      cocoapods: default
      groups:
        - appstore_credentials
      vars:
        BUNDLE_ID: com.anilguzel.vault
        XCODE_WORKSPACE: ios/Runner.xcworkspace
        XCODE_SCHEME: Runner
        APP_STORE_ID: "6782353694"
        APPLE_TEAM_ID: 25YU5R23MS

    scripts:
      - name: Set up keychain
        script: keychain initialize

      - name: Delete existing Distribution certificates
        script: |
          CERT_JSON=$(app-store-connect certificates list \
            --type IOS_DISTRIBUTION \
            --json 2>/dev/null || echo "[]")
          echo "$CERT_JSON" | \
            python3 -c "import sys,json;[print(c['id']) for c in json.load(sys.stdin)]" \
            2>/dev/null | \
            while read cert_id; do
              echo "Deleting: $cert_id"
              app-store-connect certificates delete "$cert_id" || true
            done
          echo "Done."

      - name: Fetch signing files
        script: |
          openssl genrsa -out /tmp/dist_key.pem 2048
          app-store-connect fetch-signing-files \
            "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key @file:/tmp/dist_key.pem \
            --create

      - name: Add certificates to keychain
        script: keychain add-certificates

      - name: Flutter version
        script: flutter --version

      - name: Install dependencies
        script: flutter pub get

      - name: Flutter analyze
        script: flutter analyze

      - name: Build iOS (no codesign)
        script: |
          flutter build ios \
            --release \
            --no-codesign

      - name: Set up code signing
        script: xcode-project use-profiles

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false
      email:
        recipients:
          - anlgzl52@gmail.com
        notify:
          success: true
          failure: true
